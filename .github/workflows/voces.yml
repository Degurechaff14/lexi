name: Generar voces del video
on:
  push:
    branches: [video-voces]
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts==7.0.2
      - run: python tts/gen.py
      - uses: actions/upload-artifact@v4
        with:
          name: voces
          path: voces/
