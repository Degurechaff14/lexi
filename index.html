<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lexi · Plazos civiles</title>
<meta name="description" content="Lexi: agenda de plazos procesales civiles para asistentes legales y practicantes.">
<meta name="theme-color" content="#1E3A8A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Crect x='2' y='2' width='40' height='40' rx='12' fill='%231E3A8A'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='11' y='13' width='22' height='19' rx='4'/%3E%3Cpath d='M11 19h22M17 10v5M27 10v5'/%3E%3Cpath d='M17.5 25.5l3.2 3.2 6-6.4' stroke-width='2.8'/%3E%3C/g%3E%3C/svg%3E">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: columna de trabajo con encabezado de marca, selector de tema y pestañas fijas. Cada plazo lleva una "hoja de calendario" con su último día, coloreada por urgencia. Tres paletas (Marino, Palo rosa, Petróleo), cada una con versión clara y oscura. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#131B2E; --muted:#5A6478; --line:#DCE1EA;
  --accent:#1E3A8A; --accent-ink:#FFFFFF; --soft:#E6ECF8; --inhabil:#E9ECF2;
  --red:#B3261E; --red-soft:#FBE4E2; --amber:#8A5300; --amber-soft:#FCEBCB;
  --green:#176B3F; --green-soft:#DDF1E6; --shadow:rgba(19,27,46,.07);
  --font-display:'Spectral',Georgia,'Times New Roman',serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1120; --surface:#141C2E; --ink:#E6EBF5; --muted:#98A3BA; --line:#263149;
  --accent:#8FA8FF; --accent-ink:#0B1120; --soft:#1D2945; --inhabil:#18213A;
  --red:#FF8E85; --red-soft:#4A1F1F; --amber:#F2B45A; --amber-soft:#3D2C10;
  --green:#6FD39B; --green-soft:#17382A; --shadow:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1120; --surface:#141C2E; --ink:#E6EBF5; --muted:#98A3BA; --line:#263149;
  --accent:#8FA8FF; --accent-ink:#0B1120; --soft:#1D2945; --inhabil:#18213A;
  --red:#FF8E85; --red-soft:#4A1F1F; --amber:#F2B45A; --amber-soft:#3D2C10;
  --green:#6FD39B; --green-soft:#17382A; --shadow:rgba(0,0,0,.35); color-scheme:dark}

/* Palo rosa: rosa empolvado con acento palo de rosa, sobrio */
:root[data-palette="rosa"]{
  --bg:#FBF5F6; --surface:#FFFFFF; --ink:#2B1820; --muted:#6F5A63; --line:#EBDADF;
  --accent:#9B3157; --accent-ink:#FFFFFF; --soft:#F7E6EB; --inhabil:#F1E7EA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-palette="rosa"]{
  --bg:#170F13; --surface:#22171C; --ink:#F5E8EC; --muted:#B8A0A9; --line:#3A2830;
  --accent:#EE9FBA; --accent-ink:#170F13; --soft:#3A2130; --inhabil:#2A1D23}}
:root[data-theme="dark"][data-palette="rosa"]{
  --bg:#170F13; --surface:#22171C; --ink:#F5E8EC; --muted:#B8A0A9; --line:#3A2830;
  --accent:#EE9FBA; --accent-ink:#170F13; --soft:#3A2130; --inhabil:#2A1D23}

/* Petróleo: verde azulado profundo */
:root[data-palette="petroleo"]{
  --bg:#F1F5F4; --surface:#FFFFFF; --ink:#10231F; --muted:#55665F; --line:#D6E1DE;
  --accent:#0E5C55; --accent-ink:#FFFFFF; --soft:#E1EFEC; --inhabil:#E7EDEB}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-palette="petroleo"]{
  --bg:#0A1513; --surface:#12201D; --ink:#E3F0EC; --muted:#93A9A3; --line:#23362F;
  --accent:#6FCDBF; --accent-ink:#0A1513; --soft:#183530; --inhabil:#172723}}
:root[data-theme="dark"][data-palette="petroleo"]{
  --bg:#0A1513; --surface:#12201D; --ink:#E3F0EC; --muted:#93A9A3; --line:#23362F;
  --accent:#6FCDBF; --accent-ink:#0A1513; --soft:#183530; --inhabil:#172723}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--font-body);
  padding-block:0 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:background-color .35s,color .35s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:22px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.15;font-weight:600}
h1{font-size:clamp(1.7rem,4.5vw,2.5rem);letter-spacing:-.01em}
h2{font-size:1.35rem} h3{font-size:1.1rem}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em}

/* encabezado */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;flex:none;display:block;overflow:visible}
.mark .pg{fill:var(--accent);transition:fill .35s}
.mark .gl{fill:none;stroke:var(--accent-ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:stroke .35s}
.mark .ck{stroke-width:2.8;stroke-dasharray:16;stroke-dashoffset:0;transition:stroke .35s,stroke-dashoffset .5s}
.brand:hover .mark .ck{animation:draw .6s ease-out}
@keyframes draw{from{stroke-dashoffset:16}to{stroke-dashoffset:0}}
.name .i{position:relative;display:inline-block}
.name .i i{position:absolute;left:50%;top:.02em;width:.21em;height:.21em;border-radius:50%;background:var(--accent);transform:translateX(-50%);transition:background-color .35s}
.name{font:700 1.85rem/1 var(--font-body);letter-spacing:-.045em}
.tag{font:500 .7rem var(--font-mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.themes{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.sw{display:flex;align-items:center;gap:7px;background:none;border:0;border-radius:999px;padding:6px 11px 6px 7px;color:var(--muted);font:500 .82rem var(--font-body);cursor:pointer;transition:background-color .2s,color .2s}
.sw:hover{color:var(--ink);background:var(--soft)}
.sw[aria-pressed="true"]{background:var(--soft);color:var(--ink);font-weight:600}
.sw i{width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--s1) 50%,var(--s2) 50%);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent)}
@media (max-width:560px){.sw .lbl{display:none}.sw{padding:7px}}

/* navegación */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px;transition:background-color .35s}
.seg{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto;box-shadow:0 2px 10px var(--shadow)}
.seg button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;background:none;border:0;border-radius:10px;color:var(--muted);font:500 .92rem var(--font-body);padding:10px 14px;cursor:pointer;white-space:nowrap;transition:background-color .2s,color .2s}
.seg button:hover{background:var(--soft);color:var(--ink)}
.seg button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.sw:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* avisos */
.aviso{display:flex;gap:10px;align-items:flex-start;background:var(--amber-soft);color:var(--ink);border-radius:12px;padding:11px 14px;font-size:.86rem}
.aviso .ic{color:var(--amber);margin-top:2px}
.aviso strong{color:var(--amber)}
.notice{background:var(--surface);border:1px solid var(--line)}
.ejemplos{background:var(--soft);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.9rem}

/* base */
.view{display:flex;flex-direction:column;gap:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;box-shadow:0 1px 3px var(--shadow);transition:background-color .35s,border-color .35s,box-shadow .2s,transform .2s}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-sm{display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:.86rem}
.mono{font-family:var(--font-mono);font-size:.82rem;overflow-wrap:anywhere;color:var(--muted)}
.chip{display:inline-block;font:500 .7rem var(--font-mono);padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--ink);letter-spacing:.03em}
.chip.ej{background:var(--inhabil);color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;font:600 .76rem var(--font-body);padding:4px 10px;border-radius:999px;white-space:nowrap}
.badge.red{background:var(--red-soft);color:var(--red)} .badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.calm{background:var(--soft);color:var(--ink)} .badge.done{background:var(--green-soft);color:var(--green)}
.badge.late{background:var(--red);color:var(--surface)}
.btn{display:inline-flex;align-items:center;gap:7px;font:600 .9rem var(--font-body);border-radius:10px;padding:10px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;transition:background-color .2s,color .2s,border-color .2s,transform .12s,box-shadow .2s}
.btn:hover{box-shadow:0 4px 14px var(--shadow)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft);border-color:var(--soft)}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn.danger:hover{background:var(--red-soft)}
.btn.danger.armed{background:var(--red);color:var(--surface)}
.btn.sm{padding:6px 11px;font-size:.8rem;border-radius:8px}
label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:500}
input,select,textarea{font:400 .95rem var(--font-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft);outline:none}
input[type="checkbox"]{width:18px;height:18px;flex:none;accent-color:var(--accent);margin:3px 0 0;cursor:pointer}
textarea{resize:vertical;min-height:70px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.note-text{white-space:pre-wrap;overflow-wrap:anywhere}
.done-text{text-decoration:line-through;color:var(--muted)}
.sect{display:flex;flex-direction:column;gap:10px}
.sect-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sect-h small{font:400 .88rem var(--font-body);color:var(--muted);display:inline-block}
.sect-h small::first-letter,.panel h3::first-letter{text-transform:uppercase}
.count{font:500 .72rem var(--font-mono);color:var(--muted);background:var(--inhabil);border-radius:999px;padding:2px 8px}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:16px;color:var(--muted);font-size:.9rem}

/* hoy: portada y cifras */
.hero{display:flex;flex-direction:column;gap:6px}
.hero .eyebrow{font:500 .72rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.hero h1::first-letter{text-transform:uppercase}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;padding:14px 16px}
.stat .l{font:500 .68rem var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .n{font:600 2.1rem/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.stat .s{font-size:.78rem;color:var(--muted)}
.stat.alert{background:var(--red-soft);border-color:transparent}
.stat.alert .n,.stat.alert .l{color:var(--red)}
.stat.warm .n{color:var(--accent)}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* tarjeta con hoja de calendario */
.item{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:start}
.item:hover{box-shadow:0 8px 24px var(--shadow);transform:translateY(-2px)}
.item .title{font-weight:600;font-size:1rem}
.item .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.leaf{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:11px;padding:8px 4px;min-height:74px;text-align:center;line-height:1;background:var(--soft);color:var(--accent)}
.leaf .m{font:500 .64rem var(--font-mono);letter-spacing:.1em;text-transform:uppercase}
.leaf .d{font:600 1.75rem var(--font-display);margin:4px 0 3px;font-variant-numeric:tabular-nums}
.leaf .w{font:500 .7rem var(--font-body);text-transform:capitalize;opacity:.85}
.leaf.u-red{background:var(--red-soft);color:var(--red)}
.leaf.u-amber{background:var(--amber-soft);color:var(--amber)}
.leaf.u-done{background:var(--green-soft);color:var(--green)}
.leaf.u-late{background:var(--red);color:var(--surface)}
.leaf.u-note{background:var(--inhabil);color:var(--muted)}
.leaf.u-note .ic{width:22px;height:22px;margin-bottom:5px}
.check{display:flex;gap:10px;align-items:flex-start}
.big .leaf{min-height:96px}
.big .leaf .d{font-size:2.3rem}
@media (max-width:420px){.item{grid-template-columns:54px minmax(0,1fr);gap:11px}.leaf .d{font-size:1.45rem}}

/* calendario */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.calhead .month{font:600 1.3rem var(--font-display);text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{font:500 .68rem var(--font-mono);color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding-bottom:4px}
.cell{min-height:60px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:5px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;cursor:pointer;font:inherit;text-align:left;transition:border-color .15s,background-color .15s,transform .15s}
.cell:hover{border-color:var(--accent);transform:translateY(-1px)}
.cell .d{font:500 .82rem var(--font-mono);width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cell.out{opacity:.38}
.cell.inh{background:var(--inhabil);color:var(--muted)}
.cell.today .d{background:var(--accent);color:var(--accent-ink);font-weight:600}
.cell.sel{background:var(--soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dots{display:flex;gap:3px;flex-wrap:wrap;padding-left:2px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.dot.red{background:var(--red)} .dot.amber{background:var(--amber)} .dot.done{background:var(--green)} .dot.note{background:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:12px}
.legend span{display:flex;gap:6px;align-items:center}
.panel{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}


/* barras por materia */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:90px minmax(0,1fr) 74px;gap:12px;align-items:center;font-size:.9rem}
.track{height:10px;background:var(--inhabil);border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:999px;transform-origin:left}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .7rem var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
details summary{cursor:pointer;font-weight:600}
.foot{font-size:.78rem;color:var(--muted);text-align:center;padding-top:8px}

/* acceso con cuenta */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:32px}
.auth-card{width:100%;max-width:430px;display:flex;flex-direction:column;gap:16px;padding:26px}
.auth-card .brand{justify-content:center;margin-bottom:4px}
.auth-card h1{font-size:1.5rem;text-align:center}
.auth-card .lead{margin:0;text-align:center;color:var(--muted);font-size:.92rem}
.btn.block{width:100%;justify-content:center}
.btn-google{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-google:hover{background:var(--soft)}
.btn-google svg{width:18px;height:18px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.8rem}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:600 .85rem var(--font-body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.msg{border-radius:10px;padding:10px 12px;font-size:.86rem}
.msg.err{background:var(--red-soft);color:var(--red)}
.msg.ok{background:var(--green-soft);color:var(--green)}
.code-input{font:600 1.4rem var(--font-mono);letter-spacing:.4em;text-align:center}
.hint{font-size:.78rem;color:var(--muted);font-weight:400}
.acct{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{font:600 .85rem var(--font-body)}
.sync{font:500 .72rem var(--font-mono);color:var(--muted)}
.sync.err{color:var(--red)}
.btn[disabled]{opacity:.6;cursor:wait}

/* bienvenida (primer ingreso) */
.ob{max-width:540px}
.ob-step{font:500 .7rem var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);text-align:center}
.ob-bar{display:flex;gap:6px;justify-content:center}
.ob-bar i{width:34px;height:4px;border-radius:999px;background:var(--line);transition:background-color .3s}
.ob-bar i.on{background:var(--accent)}
.ob-opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;transition:border-color .2s,background-color .2s,transform .15s}
.opt:hover{border-color:var(--accent);transform:translateY(-1px)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .ico{width:40px;height:40px;flex:none;border-radius:11px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.opt[aria-pressed="true"] .ico{background:var(--accent);color:var(--accent-ink)}
.opt .ico .ic{width:20px;height:20px}
.opt b{display:block;font-weight:600}
.opt small{display:block;color:var(--muted);font-size:.84rem;line-height:1.4}
.guides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.guide{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px 12px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;transition:border-color .2s,background-color .2s,transform .15s}
.guide:hover{border-color:var(--accent);transform:translateY(-2px)}
.guide[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}
.guide svg{width:min(120px,100%);height:auto}
.guide b{font-weight:600}
.guide small{color:var(--muted);font-size:.8rem}
.bubble{position:relative;background:var(--soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:.93rem;line-height:1.5}

function vHoy(){

  const late=S.exps.filter(e=>e.estado!=='presentado'&&plazo(e).venc<t).map(e=>({t:'plazo',e,p:plazo(e)}));
  const hoy=itemsOn(t),man=itemsOn(m);
  const prox=[];for(let i=2;i<=7;i++)prox.push(...itemsOn(addDays(t,i)));
  const urgentes=hoy.concat(man).filter(x=>x.t==='plazo'&&x.e.estado!=='presentado').length;
  let h='<section class="hero"><span class="eyebrow">Tu día</span><h1>'+fLarga(t)+'</h1><p>'+
    (urgentes?'Tienes '+urgentes+(urgentes===1?' plazo por presentar':' plazos por presentar')+' entre hoy y mañana.':'Nada de lo que cargaste vence hoy ni mañana.')+
    (late.length?' Además hay '+late.length+(late.length===1?' plazo vencido':' plazos vencidos')+' sin marcar como presentado.':'')+'</p></section>';
  const st=(l,n,s,cls)=>'<div class="card stat'+(cls?' '+cls:'')+'"><span class="l">'+l+'</span><span class="n">'+n+'</span><span class="s">'+s+'</span></div>';
  h+='<div class="stats">'+st('Vencidos',late.length,'sin presentar',late.length?'alert':'')+st('Hoy',hoy.length,'plazos y notas',hoy.length?'warm':'')+st('Mañana',man.length,'plazos y notas',man.length?'warm':'')+st('7 días',prox.length,'después de mañana','')+'</div>';
  if(S.ejemplos)h+='<div class="ejemplos"><span>Estás viendo expedientes de ejemplo para que pruebes Lexi.</span><button class="btn ghost sm" data-action="clearex">Borrar ejemplos</button></div>';
  if(late.length)h+='<section class="sect"><div class="sect-h"><h2>Vencidos sin presentar</h2><span class="count">'+late.length+'</span></div>'+late.map(itemCard).join('')+'</section>';
  h+=sec('Hoy','',hoy,'No cargaste plazos ni notas para hoy. Si tienes algo pendiente y no aparece, falta cargarlo.');
  h+=sec('Mañana',fLarga(m),man,'No cargaste plazos ni notas para mañana.');
  h+=sec('Próximos 7 días','',prox,'Nada cargado para los siguientes días.');
  return h;
}

function shiftMonth(ym,k){const p=ym.split('-').map(Number);return iso(new Date(p[0],p[1]-1+k,1,12)).slice(0,7)}
function calendar(key,fid){
  const t=todayISO(),ym=ui.cal[key]||t.slice(0,7),sel=ui.sel[key]||t;
  const first=ym+'-01',off=(parse(first).getDay()+6)%7,start=addDays(first,-off);
  let cells='';
  for(let i=0;i<42;i++){
    const d=addDays(start,i),inM=d.slice(0,7)===ym,its=itemsOn(d,fid),mi=motivoInhabil(d);
    let dots='';
    for(const it of its.slice(0,6)){
      if(it.t==='plazo'){const u=urg(it.e,it.p);dots+='<span class="dot '+(u.k==='late'?'red':u.k==='calm'?'':u.k)+'"></span>'}
      else dots+='<span class="dot note"></span>';
    }
    cells+='<button class="cell'+(inM?'':' out')+(mi?' inh':'')+(d===t?' today':'')+(d===sel?' sel':'')+'" data-action="selday" data-key="'+key+'" data-date="'+d+'" title="'+esc(mi||'')+'" aria-label="'+esc(fLarga(d)+(mi?' ('+mi+')':'')+(its.length?', '+its.length+' elementos':''))+'"'+(d===sel?' aria-pressed="true"':'')+'><span class="d">'+parseInt(d.slice(8),10)+'</span><span class="dots">'+dots+'</span></button>';
  }
  const dows=['lun','mar','mié','jue','vie','sáb','dom'].map(x=>'<div class="dow">'+x+'</div>').join('');
  const its=itemsOn(sel,fid),mi=motivoInhabil(sel);
  const panel='<div class="stack panel"><h3>'+fLarga(sel)+'</h3>'+
    (mi?'<div class="small muted">Día inhábil ('+esc(mi)+'). Los plazos no corren en este día.</div>':'')+
    (its.length?its.map(itemCard).join(''):'<div class="empty">Sin plazos ni notas este día.</div>')+
    noteForm(key,fid)+'</div>';
  return '<div class="card"><div class="calhead"><div class="month">'+fMes(ym)+'</div><div class="row" style="gap:6px">'+
    '<button class="btn ghost sm" data-action="calnav" data-key="'+key+'" data-delta="-1" aria-label="Mes anterior">'+ic('prev')+'</button>'+
    '<button class="btn ghost sm" data-action="calnav" data-key="'+key+'" data-delta="0">Hoy</button>'+
    '<button class="btn ghost sm" data-action="calnav" data-key="'+key+'" data-delta="1" aria-label="Mes siguiente">'+ic('next')+'</button></div></div>'+
    '<div class="cal">'+dows+cells+'</div>'+
    '<div class="legend"><span><i class="dot red"></i>Vence hoy o mañana</span><span><i class="dot amber"></i>Próximo</span><span><i class="dot"></i>Plazo</span><span><i class="dot done"></i>Presentado</span><span><i class="dot note"></i>Nota</span></div>'+panel+'</div>';
}

function nextHabil(d){while(motivoInhabil(d))d=addDays(d,1);return d}
function notifFor(target,n){for(let k=1;k<120;k++){const c=addDays(target,-k);if(calcPlazo(c,n).venc===target)return c}return addDays(target,-n-2)}
function seed(){
  const t=todayISO();
  const mk=(numero,acto,proceso,offset)=>{const n=ACTOS[acto].proceso?ACTOS[acto].dias[proceso]:ACTOS[acto].dias;const target=nextHabil(addDays(t,offset));return {id:uid(),numero,materia:'Civil',acto,proceso:proceso||null,notif:notifFor(target,n),estado:'pendiente',ejemplo:true,_t:target}};
  const a=mk('00093-2026-0-1801-JP-CI-03','contestacion','sumarisimo',1);
  const b=mk('00412-2026-0-1801-JR-CI-07','apel_auto',null,0);
  const c=mk('01877-2025-0-1801-JR-CI-12','apel_sentencia','conocimiento',6);
  const d=mk('02210-2025-0-1801-JR-CI-21','contestacion','abreviado',12);
  [a,b,c,d].forEach(e=>delete e._t);
  S.exps=[a,b,c,d];
  S.notas=[
   {id:uid(),exp:a.id,fecha:t,texto:'Revisar anexos 1-A y 1-B antes de redactar.',hecho:false,ejemplo:true},
   {id:uid(),exp:a.id,fecha:plazo(a).venc,texto:'Presentar el escrito temprano; confirmar cargo en mesa de partes.',hecho:false,ejemplo:true},
   {id:uid(),exp:c.id,fecha:addDays(t,3),texto:'Pedir al abogado que revise los agravios.',hecho:false,ejemplo:true}
  ];
  S.ejemplos=true;save();
}

document.addEventListener('click',function(ev){

  if(a.startsWith('ob-')){obAction(a,el);return}

  if(a==='cfg-toggle'){ui.cfg=ui.cfg?null:'menu';ui.cfgErr='';ui.nameDraft=null;render();return}
  if(a==='cfg-menu'){ui.cfg='menu';ui.cfgErr='';ui.nameDraft=null;render();return}

function tErr(e){
  const m=(e&&e.message)||String(e||'');
  if(/Invalid login credentials/i.test(m))return 'Correo o contraseña incorrectos.';
  if(/Email not confirmed/i.test(m))return 'Tu correo aún no está confirmado. Te enviamos un código nuevo.';
  if(/expired|invalid.*(otp|token)|Token has expired/i.test(m))return 'El código no es válido o ya venció. Pide uno nuevo.';
  if(/rate limit|security purposes|too many/i.test(m))return 'Demasiados intentos seguidos. Espera unos minutos y vuelve a intentar.';
  if(/at least|weak/i.test(m))return 'La contraseña debe tener al menos 8 caracteres.';
  if(/already registered|already exists/i.test(m))return 'Ese correo ya tiene una cuenta. Inicia sesión.';
  if(/Database error saving new user|duplicate key|unique/i.test(m))return 'Ese nombre de usuario ya está en uso. Elige otro.';
  if(/check constraint/i.test(m))return 'Ese nombre de usuario no es válido. Usa de 3 a 30 caracteres.';
  if(/Failed to fetch|NetworkError/i.test(m))return 'No hay conexión con el servidor. Revisa tu internet.';
  return 'No se pudo completar: '+m;
}

async function cfgSubmit(k,g){
  if(ui.busy)return;
  if(k==='cfg-name'){
    const v=normName(g('c-name').value);ui.nameDraft=v;
    if(!okName(v)){ui.cfgErr='Usa de 3 a 30 caracteres.';render();return}
    if(v===profile.username){ui.cfg='menu';ui.nameDraft=null;ui.cfgErr='';render();return}
    ui.busy=true;ui.cfgErr='';render();
    if(v.toLowerCase()!==String(profile.username).toLowerCase()){
      const r=await sb.rpc('username_available',{u:v});
      if(r.error||!r.data){ui.busy=false;ui.cfgErr=r.error?tErr(r.error):'Ese nombre de usuario ya está en uso. Elige otro.';render();return}
    }
    const {error}=await sb.from('profiles').update({username:v}).eq('id',user.id);
    ui.busy=false;
    if(error){ui.cfgErr=tErr(error);render();return}
    profile.username=v;ui.cfg='menu';ui.nameDraft=null;toast('Nombre de usuario actualizado');render();
  }else if(k==='cfg-msg'){
    const asunto=g('m-asunto').value.trim(),texto=g('m-texto').value.trim();ui.mVals={asunto,texto};
    if(!asunto||!texto){ui.mErr='Escribe el asunto y el mensaje.';renderModal();return}
    ui.busy=true;ui.mErr='';renderModal();
    const {error}=await sb.from('mensajes').insert({asunto,mensaje:texto,email:user.email||null});
    ui.busy=false;
    if(error){ui.mErr=tErr(error);renderModal();return}
    ui.modal=null;ui.mVals=null;renderModal();toast('Mensaje enviado. Te responderemos a tu correo.');
  }else if(k==='cfg-del'){
    const conf=g('m-conf').value.trim();ui.mVals={conf};
    if(conf!=='ELIMINAR'){ui.mErr='Escribe ELIMINAR en mayúsculas para confirmar.';renderModal();return}
    ui.busy=true;ui.mErr='';renderModal();
    const {error}=await sb.rpc('delete_my_account');
    ui.busy=false;
    if(error){ui.mErr=tErr(error);renderModal();return}
    try{localStorage.removeItem(storeKey())}catch(e){}
    ui.modal=null;ui.mVals=null;ui.cfg=null;ui.tour=null;renderModal();
    try{await sb.auth.signOut()}catch(e){}
    user=null;profile=null;S={exps:[],notas:[],extras:[],ejemplos:false};lastKey=null;
    setA({mode:'login',err:'',ok:'Tu cuenta y todos tus datos fueron eliminados.',busy:false});
  }
}

const O={step:0,username:'',nivel:'',guia:'',err:'',busy:false};
function renderOnboard(){
  document.body.classList.remove('touring');
  if(!O.username)O.username=(profile&&profile.username)||'';
  const bar='<div class="ob-bar" aria-hidden="true">'+[0,1,2].map(i=>'<i class="'+(i<=O.step?'on':'')+'"></i>').join('')+'</div><div class="ob-step">Paso '+(O.step+1)+' de 3</div>';
  const msg=O.err?'<div class="msg err" role="alert">'+esc(O.err)+'</div>':'';
  let h='';
  if(O.step===0){
    h='<h1>Elige tu nombre de usuario</h1><p class="lead">Así te verás en Lexi. Puedes dejar el sugerido o cambiarlo.</p>'+
    '<form class="stack" data-form="ob-user"><label>Nombre de usuario<input id="o-user" required minlength="3" maxlength="30" autocomplete="nickname" value="'+esc(O.username)+'"><span class="hint">De 3 a 30 caracteres. Puedes usar mayúsculas, espacios y tildes.</span></label>'+msg+
    '<button class="btn block" type="submit"'+(O.busy?' disabled':'')+'>'+(O.busy?'Revisando…':'Continuar')+'</button></form>';
  }else if(O.step===1){
    h='<h1>¿Cuál es tu experiencia?</h1><p class="lead">Así tu guía sabrá cuánto detalle darte.</p><div class="ob-opts" role="group" aria-label="Nivel de experiencia">'+
    NIVELES.map(n=>'<button type="button" class="opt" data-action="ob-nivel" data-v="'+n[0]+'" aria-pressed="'+(O.nivel===n[0])+'"><span class="ico">'+ic(n[3])+'</span><span><b>'+n[1]+'</b><small>'+n[2]+'</small></span></button>').join('')+'</div>'+msg+
    '<button class="btn block" type="button" data-action="ob-next"'+(O.nivel?'':' disabled')+'>Continuar</button><button class="linkbtn" type="button" data-action="ob-back">Volver</button>';
  }else{
    const g=GUIAS[O.guia];
    h='<h1>Elige a tu guía</h1><p class="lead">Te acompañará en un recorrido corto por Lexi.</p><div class="guides" role="group" aria-label="Guía">'+
    Object.keys(GUIAS).map(k=>'<button type="button" class="guide" data-action="ob-guia" data-v="'+k+'" aria-pressed="'+(O.guia===k)+'">'+avatar(k)+'<b>'+GUIAS[k].n+'</b></button>').join('')+'</div>'+
    '<div class="bubble" aria-live="polite">'+(g?esc(hola(g)):'Toca a quien quieras como guía.')+'</div>'+msg+
    '<button class="btn block" type="button" data-action="ob-finish"'+(O.guia&&!O.busy?'':' disabled')+'>'+(O.busy?'Guardando…':'Empezar el recorrido')+'</button><button class="linkbtn" type="button" data-action="ob-back">Volver</button>';
  }
  document.getElementById('app').innerHTML='<div class="auth"><div class="card auth-card ob">'+bar+h+'</div></div>';
  if(O.step===0&&!O.busy){const i=document.getElementById('o-user');if(i)i.focus()}
}
async function obUser(g){
  const v=normName(g('o-user').value);
  if(!okName(v)){O.err='El nombre de usuario debe tener de 3 a 30 caracteres.';O.username=v;renderOnboard();return}
  O.username=v;O.err='';
  if(v.toLowerCase()!==String(profile.username).toLowerCase()){
    O.busy=true;renderOnboard();
    const r=await sb.rpc('username_available',{u:v});O.busy=false;
    if(r.error){O.err=tErr(r.error);renderOnboard();return}
    if(!r.data){O.err='Ese nombre de usuario ya está en uso. Elige otro.';renderOnboard();return}
  }
  O.step=1;renderOnboard();
}
async function obAction(a,el){
  if(a==='ob-nivel'){O.nivel=el.dataset.v;O.err=''}
  else if(a==='ob-guia'){O.guia=el.dataset.v;O.err=''}
  else if(a==='ob-next'){if(O.nivel)O.step=2}
  else if(a==='ob-back'){O.step=Math.max(0,O.step-1);O.err=''}
  else if(a==='ob-finish'){
    if(!O.guia||O.busy)return;
    O.busy=true;renderOnboard();
    const upd={nivel:O.nivel,guia:O.guia,onboarded:true};
    if(O.username&&O.username!==profile.username)upd.username=O.username;
    const {error}=await sb.from('profiles').update(upd).eq('id',user.id);
    O.busy=false;
    if(error){
      if(/duplicate|unique/i.test(error.message)){O.step=0;O.err='Ese nombre de usuario ya está en uso. Elige otro.'}
      else O.err=tErr(error);
      renderOnboard();return;
    }
    Object.assign(profile,upd);
    ui.view='hoy';ui.tour={i:0};lastKey=null;scrollTo(0,0);render();return;
  }
  renderOnboard();
}
function tourSteps(){
  const nuevo=profile&&(profile.nivel==='practicante'||profile.nivel==='junior');
  const g=GUIAS[(profile&&profile.guia)||'valeria'];
  return [
   {v:'hoy',hl:'carnet',t:hola(g)+' Me verás siempre aquí arriba, en mi carnet. Tócalo cuando quieras repetir este recorrido.'},
   {v:'hoy',hl:'nav-hoy',t:'Esta es tu pantalla principal: lo que vence hoy, mañana y en los próximos 7 días. La hoja de calendario de cada plazo cambia de color según la urgencia: rojo si vence hoy o mañana, ámbar si es pronto, verde si ya lo presentaste.',x:nuevo?'Cuando presentes el escrito, pulsa «Marcar presentado» para que Lexi deje de alertarte.':''},
   {v:'cal',hl:'nav-cal',t:'En el Calendario ves todos tus plazos y notas del mes. Los días grises son inhábiles y no cuentan para los plazos. Toca cualquier día para anotar algo, como «llevar anexos».'},
   {v:'exp',hl:'nav-exp',t:'En Expedientes registras cada caso solo con su número. Eliges el acto, el tipo de proceso y la fecha de notificación, y Lexi calcula el último día y te muestra cómo lo contó.',x:nuevo?'Si no sabes qué tipo de proceso es, revísalo en el auto admisorio o pregúntale a tu abogado.':''},
   {v:'reglas',hl:'nav-reglas',t:'En Reglas están los plazos que usa Lexi y los feriados. Si el Poder Judicial declara un día inhábil, agrégalo aquí y tus plazos se recalculan solos.'},
   {v:'hoy',hl:'gear',t:'En la tuerca de configuración cambias los colores de Lexi y tu nombre de usuario, nos envías un mensaje, cierras sesión o eliminas tu cuenta.'},
   {v:'hoy',hl:null,t:'Un último consejo: Lexi es una ayuda. La fecha oficial siempre se verifica en el sistema del Poder Judicial. ¡Éxitos con tus plazos!'}
  ];
}
function renderTour(){
  const old=document.getElementById('tour');if(old)old.remove();
  document.querySelectorAll('.hl').forEach(e=>e.classList.remove('hl'));
  if(!ui.tour||!user){document.body.classList.remove('touring');return}
  const st=tourSteps(),i=ui.tour.i,s=st[i],g=GUIAS[(profile&&profile.guia)||'valeria'];
  document.body.classList.add('touring');
  if(s.hl){const t=s.hl.startsWith('nav-')?document.querySelector('.seg [data-v="'+s.hl.slice(4)+'"]'):document.querySelector('.'+s.hl);if(t){t.classList.add('hl');try{t.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'})}catch(e){}}}
  const el=document.createElement('div');el.id='tour';el.className='tour';el.setAttribute('role','dialog');el.setAttribute('aria-label','Guía de Lexi');
  el.innerHTML=avatar((profile&&profile.guia)||'valeria')+'<div><div class="tour-n">'+g.n+'</div><p>'+esc(s.t)+'</p>'+(s.x?'<p class="extra">'+esc(s.x)+'</p>':'')+
    '<div class="tour-ctl"><div class="tour-dots" aria-label="Paso '+(i+1)+' de '+st.length+'">'+st.map((_,k)=>'<i class="'+(k===i?'on':'')+'"></i>').join('')+'</div><div class="row" style="gap:6px">'+
    (i===st.length-1?'':'<button class="btn ghost sm" data-action="tour-skip">Saltar</button>')+
    (i>0?'<button class="btn ghost sm" data-action="tour-prev">Atrás</button>':'')+
    '<button class="btn sm" data-action="tour-next">'+(i===st.length-1?'Empezar':'Siguiente')+'</button></div></div></div>';
  document.body.appendChild(el);
  const nb=el.querySelector('[data-action="tour-next"]');if(nb)nb.focus({preventScroll:true});
}
function tourAction(a){
  if(a==='tour-start'){ui.tour={i:0}}
  else if(a==='tour-skip'){ui.tour=null}
  else if(ui.tour){
    const n=tourSteps().length;
    ui.tour.i+=a==='tour-next'?1:-1;
    if(ui.tour.i>=n){ui.tour=null;toast('¡Listo! Ya puedes usar Lexi')}
    else if(ui.tour.i<0)ui.tour.i=0;
  }
  if(ui.tour){const v=tourSteps()[ui.tour.i].v;if(ui.view!==v){ui.view=v;ui.showForm=false;scrollTo(0,0)}}
  render();
}
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(ui.modal&&!ui.busy){ui.modal=null;renderModal()}else if(ui.cfg){ui.cfg=null;render();const gb=document.querySelector('.gear');if(gb)gb.focus()}else if(ui.tour){ui.tour=null;render()}});
function MARK(){return '<svg class="mark" viewBox="0 0 44 44" aria-hidden="true"><rect class="pg" x="2" y="2" width="40" height="40" rx="12"/><rect class="gl" x="11" y="13" width="22" height="19" rx="4"/><path class="gl" d="M11 19h22M17 10v5M27 10v5"/><path class="gl ck" d="M17.5 25.5l3.2 3.2 6-6.4"/></svg>'}
function setA(o){Object.assign(A,o);renderAuth()}
async function authAction(a,el){
  if(a==='logout'){ui.cfg=null;ui.tour=null;await sb.auth.signOut();try{localStorage.removeItem(storeKey())}catch(e){}user=null;profile=null;S={exps:[],notas:[],extras:[],ejemplos:false};lastKey=null;setA({mode:'login',err:'',ok:'',busy:false});return}
  if(a==='auth-mode'){setA({mode:el.dataset.m,err:'',ok:'',pw:'',pw2:''});return}
  if(a==='auth-google'){setA({gbusy:true,err:'',ok:''});const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:SITE}});if(error)setA({gbusy:false,err:tErr(error)});return}
  if(a==='auth-resend'){setA({busy:true,err:'',ok:''});const {error}=await sb.auth.resend({type:'signup',email:A.email,options:{emailRedirectTo:SITE}});setA({busy:false,err:error?tErr(error):'',ok:error?'':'Te enviamos un código nuevo.'});return}
}
async function authSubmit(k,g){
  if(A.busy)return;
  if(k==='auth-login'){
    const email=g('a-email').value.trim(),password=g('a-pass').value;setA({email,pw:password,busy:true,err:'',ok:''});
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error&&/Email not confirmed/i.test(error.message)){await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:SITE}});setA({busy:false,mode:'code',kind:'signup',err:'',ok:tErr(error)});return}
    if(error)setA({busy:false,err:tErr(error)});
  }else if(k==='auth-signup'){
    const username=normName(g('a-user').value),email=g('a-email').value.trim(),password=g('a-pass').value;
    const pw2=g('a-pass2').value;
    if(!okName(username)){setA({email,user:username,pw:password,pw2,err:'El nombre de usuario debe tener de 3 a 30 caracteres.'});return}
    if(password!==pw2){setA({email,user:username,pw:password,pw2,err:'Las contraseñas no coinciden.'});return}
    setA({email,user:username,pw:password,pw2,busy:true,err:'',ok:''});
    const av=await sb.rpc('username_available',{u:username});
    if(av.error){setA({busy:false,err:tErr(av.error)});return}
    if(!av.data){setA({busy:false,err:'Ese nombre de usuario ya está en uso. Elige otro.'});return}
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{username},emailRedirectTo:SITE}});
    if(error){setA({busy:false,err:tErr(error)});return}
    if(data.user&&Array.isArray(data.user.identities)&&data.user.identities.length===0){setA({busy:false,err:'Ese correo ya tiene una cuenta. Inicia sesión.'});return}
    if(!data.session)setA({busy:false,mode:'code',kind:'signup',pw:'',pw2:''});
  }else if(k==='auth-code'){
    const token=g('a-code').value.trim();setA({busy:true,err:'',ok:''});
    const {error}=await sb.auth.verifyOtp({email:A.email,token,type:'signup'});
    if(error)setA({busy:false,err:tErr(error)});
  }else if(k==='auth-forgot'){
    const email=g('a-email').value.trim();setA({email,busy:true,err:''});
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:SITE});
    setA(error?{busy:false,err:tErr(error)}:{busy:false,mode:'reset'});
  }else if(k==='auth-reset'){
    const token=g('a-code').value.trim(),password=g('a-pass').value;setA({busy:true,err:''});
    const v=await sb.auth.verifyOtp({email:A.email,token,type:'recovery'});
    if(v.error){setA({busy:false,err:tErr(v.error)});return}
    const u=await sb.auth.updateUser({password});
    if(u.error){toast('No se pudo cambiar la contraseña: '+tErr(u.error))}else toast('Contraseña actualizada');
  }
}
async function enterApp(session){
  user=session.user;Object.assign(A,{busy:false,gbusy:false,mode:'loading',pw:'',pw2:'',err:'',ok:''});renderAuth();
  S={exps:[],notas:[],extras:[],ejemplos:false};
  const [pr,ud]=await Promise.all([
    sb.from('profiles').select('username,nivel,guia,onboarded').eq('id',user.id).maybeSingle(),
    sb.from('user_data').select('data').eq('user_id',user.id).maybeSingle()
  ]);
  profile=pr.data||null;
  if(pr.error){const p2=await sb.from('profiles').select('username').eq('id',user.id).maybeSingle();profile=p2.data?Object.assign(p2.data,{onboarded:true}):null}
  if(ud.error){
    if(!load()){A.mode='login';A.err='No se pudieron cargar tus datos: '+tErr(ud.error);user=null;await sb.auth.signOut();renderAuth();return}
    sync='err';
  }else if(ud.data&&ud.data.data&&Array.isArray(ud.data.data.exps)){
    S=Object.assign(S,ud.data.data);try{localStorage.setItem(storeKey(),JSON.stringify(S))}catch(e){}
  }else{
    let legacy=null;try{legacy=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
    if(legacy&&Array.isArray(legacy.exps)&&legacy.exps.some(e=>!e.ejemplo)){
      const ids=new Set(legacy.exps.filter(e=>!e.ejemplo).map(e=>e.id));
      S={exps:legacy.exps.filter(e=>!e.ejemplo),notas:(legacy.notas||[]).filter(n=>ids.has(n.exp)),extras:legacy.extras||[],ejemplos:false};
      save();toast('Pasamos tus expedientes de este navegador a tu cuenta');
    }else seed();
  }
  lastKey=null;ui.view='hoy';render();
}
function bootCloud(){
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey);
  const hp=new URLSearchParams(location.hash.slice(1)+'&'+location.search.slice(1));
  if(hp.get('error')||hp.get('error_description')){
    const code=hp.get('error')||'',desc=hp.get('error_description')||'';
    A.err=/access_denied|cancel/i.test(code+desc)?'Cancelaste el inicio de sesión con Google. Puedes intentarlo otra vez o entrar con tu correo.':'No se pudo entrar con Google: '+desc;
    history.replaceState(null,'',SITE);
  }
  /* Al volver con el botón Atrás, el navegador restaura la página tal como quedó: se reactivan los botones. */
  addEventListener('pageshow',e=>{if(e.persisted&&!user){A.busy=false;A.gbusy=false;renderAuth()}});
  addEventListener('focus',()=>{if(A.gbusy&&!user)setTimeout(()=>{if(A.gbusy&&!user){A.gbusy=false;renderAuth()}},1500)});
  sb.auth.onAuthStateChange((ev,session)=>{
    setTimeout(()=>{
      if(session&&(!user||user.id!==session.user.id)){if(location.hash.includes('access_token'))history.replaceState(null,'',SITE);enterApp(session)}
      else if(!session&&user){user=null;profile=null;setA({mode:'login'})}
      else if(!session&&ev==='INITIAL_SESSION')renderAuth();
    },0);
  });
  addEventListener('online',()=>{if(user&&sync==='err')queueSync()});
}

loadTema();applyTema();
if(CLOUD&&!window.supabase){document.getElementById('app').innerHTML='<div class="auth"><div class="card auth-card"><h1>No se pudo conectar</h1><p class="lead">No se pudo cargar el sistema de cuentas. Revisa tu conexión a internet y recarga la página.</p></div></div>'}
else if(CLOUD){bootCloud()}
else{if(!load())seed();render()}
})();
</script>
